<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-labelledby="p5title">
  <title id="p5title">AI SDR and Meeting Intelligence preview graphic</title>
  <defs>
    <linearGradient id="p5Grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1c1b1b"/>
      <stop offset="100%" stop-color="#0b0b0b"/>
    </linearGradient>
    <radialGradient id="p5Glow" cx="90%" cy="85%" r="55%">
      <stop offset="0%" stop-color="#ff6b00" stop-opacity="0.20"/>
      <stop offset="100%" stop-color="#ff6b00" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="800" height="450" fill="url(#p5Grad)"/>
  <rect width="800" height="450" fill="url(#p5Glow)"/>
  <text x="792" y="392" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="260" fill="#ffffff" fill-opacity="0.045" text-anchor="end">05</text>
  <!-- meeting-audio waveform motif -->
  <g stroke="#ff6b00" stroke-linecap="round" stroke-width="6" opacity="0.6">
    <line x1="560" y1="150" x2="560" y2="170"/>
    <line x1="580" y1="120" x2="580" y2="200"/>
    <line x1="600" y1="90"  x2="600" y2="230"/>
    <line x1="620" y1="130" x2="620" y2="190"/>
    <line x1="640" y1="105" x2="640" y2="215"/>
    <line x1="660" y1="140" x2="660" y2="180"/>
    <line x1="680" y1="95"  x2="680" y2="225"/>
    <line x1="700" y1="125" x2="700" y2="195"/>
  </g>
  <text x="48" y="56" font-family="'JetBrains Mono', Consolas, monospace" font-size="14" letter-spacing="3" fill="#ff6b00">AI AUTOMATION</text>
  <text x="46" y="266" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="38" letter-spacing="-1" fill="#f2ede9">AI SDR &amp; MEETING</text>
  <text x="46" y="312" font-family="Arial, Helvetica, sans-serif" font-weight="800" font-size="38" letter-spacing="-1" fill="#f2ede9">INTELLIGENCE</text>
  <rect x="0" y="446" width="800" height="4" fill="#ff6b00" fill-opacity="0.65"/>
