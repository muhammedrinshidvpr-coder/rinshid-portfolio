<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="Automation workflow diagram">
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3a1a08"/>
      <stop offset="55%" stop-color="#1c1b1b"/>
      <stop offset="100%" stop-color="#0e0e0e"/>
    </linearGradient>
    <pattern id="dotGrid" width="28" height="28" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.4" fill="#ffffff" opacity="0.10"/>
    </pattern>
    <filter id="softGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="800" height="600" fill="url(#heroGrad)"/>
  <circle cx="620" cy="120" r="180" fill="#ff6b00" opacity="0.12"/>
  <circle cx="150" cy="500" r="140" fill="#ffb693" opacity="0.08"/>

  <!-- workflow canvas panel -->
  <rect x="70" y="90" width="660" height="420" rx="18" fill="#141312" opacity="0.55" stroke="#3a3836" stroke-width="1"/>
  <rect x="70" y="90" width="660" height="420" rx="18" fill="url(#dotGrid)"/>

  <!-- connector lines -->
  <path d="M 190 190 C 260 190, 260 190, 320 190" stroke="#ff6b00" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M 420 190 C 470 190, 470 190, 520 190" stroke="#ff6b00" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M 620 210 C 620 280, 620 280, 620 330" stroke="#ff6b00" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M 570 380 C 500 380, 500 380, 440 380" stroke="#ff6b00" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M 340 380 C 280 380, 280 380, 220 380" stroke="#ff6b00" stroke-width="2.5" fill="none" opacity="0.55"/>
  <path d="M 170 340 C 170 300, 170 300, 170 250" stroke="#ff6b00" stroke-width="2.5" fill="none" opacity="0.35" stroke-dasharray="5 6"/>

  <!-- node: Trigger -->
  <g filter="url(#softGlow)">
    <circle cx="160" cy="190" r="34" fill="#201f1f" stroke="#ff6b00" stroke-width="2"/>
    <path d="M 154 175 L 168 190 L 158 190 L 166 205 L 152 190 L 162 190 Z" fill="#ff6b00"/>
  </g>
  <text x="160" y="245" fill="#e5e2e1" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.5" text-anchor="middle" opacity="0.8">TRIGGER</text>

  <!-- node: AI Agent -->
  <g filter="url(#softGlow)">
    <circle cx="370" cy="190" r="34" fill="#201f1f" stroke="#ff6b00" stroke-width="2"/>
    <rect x="355" y="177" width="30" height="26" rx="6" fill="none" stroke="#ff6b00" stroke-width="2.2"/>
    <circle cx="363" cy="188" r="2.4" fill="#ff6b00"/>
    <circle cx="377" cy="188" r="2.4" fill="#ff6b00"/>
    <path d="M 361 197 h 18" stroke="#ff6b00" stroke-width="2" stroke-linecap="round"/>
  </g>
  <text x="370" y="245" fill="#e5e2e1" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.5" text-anchor="middle" opacity="0.8">AI AGENT</text>

  <!-- node: API -->
  <g filter="url(#softGlow)">
    <circle cx="620" cy="190" r="34" fill="#201f1f" stroke="#ff6b00" stroke-width="2"/>
    <path d="M 606 178 L 614 190 L 606 202" stroke="#ff6b00" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <path d="M 634 178 L 626 190 L 634 202" stroke="#ff6b00" stroke-width="2.4" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
    <line x1="622" y1="176" x2="618" y2="204" stroke="#ff6b00" stroke-width="2"/>
  </g>
  <text x="620" y="245" fill="#e5e2e1" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.5" text-anchor="middle" opacity="0.8">API</text>

  <!-- node: Database -->
  <g filter="url(#softGlow)">
    <circle cx="620" cy="360" r="34" fill="#201f1f" stroke="#ff6b00" stroke-width="2"/>
    <ellipse cx="620" cy="349" rx="15" ry="6" fill="none" stroke="#ff6b00" stroke-width="2"/>
    <path d="M 605 349 v 18 c 0 3.5 6.7 6 15 6 s 15 -2.5 15 -6 v -18" fill="none" stroke="#ff6b00" stroke-width="2"/>
    <path d="M 605 358 c 0 3.5 6.7 6 15 6 s 15 -2.5 15 -6" fill="none" stroke="#ff6b00" stroke-width="2" opacity="0.7"/>
  </g>
  <text x="620" y="415" fill="#e5e2e1" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.5" text-anchor="middle" opacity="0.8">DATA</text>

  <!-- node: Deploy/Output -->
  <g filter="url(#softGlow)">
    <circle cx="380" cy="380" r="34" fill="#201f1f" stroke="#ff6b00" stroke-width="2"/>
    <path d="M 380 364 L 396 388 L 388 388 L 388 396 L 372 396 L 372 388 L 364 388 Z" fill="#ff6b00"/>
  </g>
  <text x="380" y="435" fill="#e5e2e1" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="1.5" text-anchor="middle" opacity="0.8">DEPLOY</text>

  <!-- node: Monitor (dashed feedback loop) -->
  <g filter="url(#softGlow)">
    <circle cx="170" cy="360" r="30" fill="#201f1f" stroke="#ff6b00" stroke-width="2" opacity="0.85"/>
    <rect x="157" y="349" width="26" height="18" rx="2" fill="none" stroke="#ff6b00" stroke-width="2"/>
    <line x1="170" y1="367" x2="170" y2="373" stroke="#ff6b00" stroke-width="2"/>
    <line x1="162" y1="373" x2="178" y2="373" stroke="#ff6b00" stroke-width="2"/>
  </g>
  <text x="170" y="410" fill="#e5e2e1" font-family="JetBrains Mono, monospace" font-size="12" letter-spacing="1.5" text-anchor="middle" opacity="0.7">MONITOR</text>

  <text x="400" y="470" fill="#a98a7d" font-family="JetBrains Mono, monospace" font-size="13" letter-spacing="2" text-anchor="middle" opacity="0.6">END-TO-END AUTOMATION PIPELINE</text>
</svg>
